name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci-backend:
    name: Backend - Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  ci-frontend:
    name: Frontend - Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: ci-frontend
    steps:
      - name: Trigger Vercel deploy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
          echo $STATUS | grep -q "^2" && echo "Vercel deploy triggered" || (echo "Deploy hook failed" && exit 1)

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: ci-backend
    steps:
      - name: Trigger Render deploy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo $STATUS | grep -q "^2" && echo "Render deploy triggered" || (echo "Render deploy failed" && exit 1)
