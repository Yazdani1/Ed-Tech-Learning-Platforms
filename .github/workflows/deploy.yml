# Deploy: the Vercel deploy hook (frontend) and the Render API (backend).
# Called by ci.yml only after every CI job passed (lint, types, format, docs, audit, secrets, builds,
# backend tests, frontend component tests and all Playwright e2e tests), so a failing push never deploys.
# Can also be started by hand (Actions > Deploy > Run workflow); that skips CI on purpose.
name: Deploy

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
          echo $STATUS | grep -q "^2" && echo "Vercel deploy triggered" || (echo "Deploy hook failed" && exit 1)

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo $STATUS | grep -q "^2" && echo "Render deploy triggered" || (echo "Render deploy failed" && exit 1)
