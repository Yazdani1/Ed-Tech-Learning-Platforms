name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend - Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  frontend:
    name: Frontend - Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Build-only values: the real URLs are set in Vercel (frontend/.env.example)
          BACKEND_INTERNAL_URL: http://localhost:5000
          NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
