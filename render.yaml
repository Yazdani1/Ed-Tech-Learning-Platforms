services:
  # Redis for rate limits, login locks and Socket.io rooms shared by every backend instance
  - type: keyvalue
    name: edtech-redis
    plan: free
    ipAllowList: [] # only services in this Render account can connect
    maxmemoryPolicy: noeviction # limit and lock keys expire on their own; never drop them early
  - type: web
    name: edtech-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: edtech-redis
          property: connectionString
      - key: PROXY_SHARED_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
